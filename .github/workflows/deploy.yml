name: Azure YouTube Data Pipeline CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to execute'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - plan
          - destroy

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: 'terraform/envs/prod'
  PYTHON_VERSION: '3.12'
  RESOURCE_GROUP: 'HAMZA-RESOURCE-GROUP'
  ACR_LOGIN_SERVER: 'ytpipeline387f2fdeacr.azurecr.io'

jobs:
  changes:
    name: '0. Detect Changed Application Areas'
    runs-on: ubuntu-latest
    outputs:
      ingest: ${{ steps.filter.outputs.ingest }}
      raw_transform: ${{ steps.filter.outputs.raw_transform }}
      dbt: ${{ steps.filter.outputs.dbt }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ingest:
              - 'jobs/ingest/**'
            raw_transform:
              - 'jobs/raw_transform/**'
            dbt:
              - 'dbt/**'
            dashboard:
              - 'dashboard/**'
            all:
              - 'jobs/**'
              - 'dbt/**'
              - 'dashboard/**'
              - 'scripts/**'
              - '.github/workflows/**'

  terraform:
    name: '1. Provision Azure Infrastructure (Terraform - On Demand Only)'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set ARM Environment Variables for Terraform
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.subscriptionId')" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.tenantId')" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Ensure Azure Backend State Storage Exists
        run: |
          az group create --name "${{ env.RESOURCE_GROUP }}" --location "southcentralus"
          az storage account create --name "hamzatfstate72143" --resource-group "${{ env.RESOURCE_GROUP }}" --location "southcentralus" --sku Standard_LRS --allow-blob-public-access false || true
          az storage container create --name "tfstate" --account-name "hamzatfstate72143" --auth-mode login || true
          az storage blob lease break --account-name "hamzatfstate72143" --container-name "tfstate" --blob-name "prod.terraform.tfstate" --auth-mode login 2>/dev/null || true

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Get Runner Public IP
        id: runner_ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Terraform Plan / Apply
        run: |
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            terraform destroy -auto-approve -var="youtube_api_key=${{ secrets.YOUTUBE_API_KEY }}" -var="alert_email=${{ secrets.ALERT_EMAIL }}"
          else
            terraform apply -auto-approve -var="youtube_api_key=${{ secrets.YOUTUBE_API_KEY }}" -var="alert_email=${{ secrets.ALERT_EMAIL }}" -var="deployer_ip_address=${{ steps.runner_ip.outputs.ip }}"
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}

  build-and-push-containers:
    name: '2. Build & Push Microservice Docker Images'
    needs: changes
    if: always() && (needs.changes.outputs.all == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Ingest Container
        if: needs.changes.outputs.ingest == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./jobs/ingest
          file: ./jobs/ingest/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/yt-ingest:latest
            ${{ env.ACR_LOGIN_SERVER }}/yt-ingest:${{ github.sha }}

      - name: Build & Push Raw Transform Container
        if: needs.changes.outputs.raw_transform == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./jobs/raw_transform
          file: ./jobs/raw_transform/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/yt-raw-transform:latest
            ${{ env.ACR_LOGIN_SERVER }}/yt-raw-transform:${{ github.sha }}

      - name: Build & Push dbt Container
        if: needs.changes.outputs.dbt == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./dbt
          file: ./dbt/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/yt-dbt:latest
            ${{ env.ACR_LOGIN_SERVER }}/yt-dbt:${{ github.sha }}

      - name: Build & Push Dashboard Container
        if: needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/yt-dashboard:latest
            ${{ env.ACR_LOGIN_SERVER }}/yt-dashboard:${{ github.sha }}

  deploy-and-initialize:
    name: '3. Update Azure Services & Trigger Pipeline Orchestration'
    needs: [changes, build-and-push-containers]
    if: always() && (needs.changes.outputs.all == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract Subscription ID
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          echo "AZURE_SUB_ID=$SUB_ID" >> $GITHUB_ENV

      - name: Update Ingest Job Container Image
        if: needs.changes.outputs.ingest == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Updating Container Apps Job: yt-pipeline-ingest with image tag ${{ github.sha }}..."
          az containerapp job update \
            --name yt-pipeline-ingest \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/yt-ingest:${{ github.sha }} || true

      - name: Update Raw Transform Job Container Image
        if: needs.changes.outputs.raw_transform == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Updating Container Apps Job: yt-pipeline-raw-transform with image tag ${{ github.sha }}..."
          az containerapp job update \
            --name yt-pipeline-raw-transform \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/yt-raw-transform:${{ github.sha }} || true

      - name: Update DBT Job Container Image
        if: needs.changes.outputs.dbt == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Updating Container Apps Job: yt-pipeline-dbt with image tag ${{ github.sha }}..."
          az containerapp job update \
            --name yt-pipeline-dbt \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/yt-dbt:${{ github.sha }} || true

      - name: Update Dashboard Container App Image
        if: needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Updating Container App: yt-pipeline-dashboard with image tag ${{ github.sha }}..."
          az containerapp update \
            --name yt-pipeline-dashboard \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/yt-dashboard:${{ github.sha }} || true

      - name: Trigger Logic App Orchestration Pipeline
        run: |
          echo "Triggering Logic App end-to-end orchestration pipeline (yt-pipeline-orchestration)..."
          az rest --method post --uri "https://management.azure.com/subscriptions/${AZURE_SUB_ID}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.Logic/workflows/yt-pipeline-orchestration/triggers/Hourly/run?api-version=2019-05-01"
